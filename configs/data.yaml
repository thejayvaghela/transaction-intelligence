# Phase 1 data-pipeline config. `make data` reads this — change config here, not code.
# See docs/01-data-pipeline.md.

seed: 20260626                 # global RNG seed -> deterministic, reproducible output

gazetteer: data/gazetteer/gazetteer.yaml
out_dir: data/processed

# Descriptor synthesis
rows_per_merchant: 20          # descriptor variants per merchant (diversity now comes from ~1.5k merchants)
noise_level: 1.0              # scales transform aggressiveness (0=clean .. >1=harsher)

# Leakage-safe splitting (by merchant group), stratified by subtype
split:
  train: 0.70
  val: 0.15
  test: 0.15

# Gold eval set (hand-verified; built separately, committed to data/gold/)
gold:
  size: 400
