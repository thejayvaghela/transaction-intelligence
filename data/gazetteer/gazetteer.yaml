# Merchant gazetteer — curated ground truth seeding the descriptor synthesizer.
#
# Keyed by namespaced subtype (must exist in transaction_intelligence.taxonomy).
# Each block declares default `mcc` + `channel`, then a `merchants` list. A merchant is
# a bare name (synthesizer handles casing/punctuation/surface forms) OR a
# {name, aliases: [...]} dict when the real-world abbreviation is non-obvious.
#
# channel: card_present | online | recurring | financial   (drives descriptor formatting)
# mcc: null where these items typically arrive via bank feed without an MCC.
#
# Expand breadth here if the synthetic-to-real gap (docs/01) reveals coverage holes.

