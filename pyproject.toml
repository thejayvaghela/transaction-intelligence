[project]
name = "transaction-intelligence"
version = "0.0.1"
description = "Fine-tuned + distilled classifier for noisy card/bank transaction descriptor strings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# ML/runtime deps are added per-phase (kept out of Phase 0 to keep the env light).

[dependency-groups]
dev = [
    "ruff>=0.6",
    "black>=24.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transaction_intelligence"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # errors, pyflakes, isort, pyupgrade, bugbear

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
