[project]
name = "transaction-intelligence"
version = "0.0.1"
description = "Fine-tuned + distilled classifier for noisy card/bank transaction descriptor strings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.5.3",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
train = [
    "accelerate>=1.14.0",
    "datasets>=5.0.0",
    "mlflow-skinny>=2.16",
    "sentencepiece>=0.2.1",
    "torch>=2.12.1",
    "transformers>=4.41",
]

# ML/runtime deps are added per-phase (kept out of Phase 0 to keep the env light).

[dependency-groups]
dev = [
    "ruff>=0.6",
    "black>=24.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transaction_intelligence"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # errors, pyflakes, isort, pyupgrade, bugbear

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
